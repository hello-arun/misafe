<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MI Lab RP & GP Presentation Schedule.">
<title>MI SAFE - Am I Safe?</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f6f8;
    color: #17202a;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page { width: min(1100px, 94vw); padding: 32px 0; }

  header { text-align: center; margin-bottom: 28px; }

  h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 700;
    letter-spacing: -0.8px;
  }

  .subtitle { margin-top: 8px; color: #697586; font-size: 15px; }

  .next {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }

  .card {
    background: white;
    border: 1px solid #e2e7ec;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 8px 25px rgba(20, 30, 40, .06);
  }

  .card.next-card { border-top: 5px solid #72a66f; }

  .label {
    color: #6b7280;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .name { margin-top: 12px; font-size: clamp(28px, 4vw, 40px); font-weight: 750; }
  .duration { margin-top: 6px; color: #7b8490; font-size: 14px; }

  .schedule { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  .column {
    background: white;
    border: 1px solid #e2e7ec;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(20, 30, 40, .05);
  }

  .column-header {
    padding: 17px 20px;
    border-bottom: 1px solid #e8ebef;
    font-weight: 700;
    font-size: 17px;
  }

  .list { max-height: 340px; overflow-y: auto; scroll-behavior: smooth; }

  .person {
    padding: 14px 20px;
    border-bottom: 1px solid #eef0f2;
    color: #59636e;
    font-size: 15px;
    transition: .2s ease;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .person:last-child { border-bottom: 0; }
  .person .who { flex: 1; }
  .person .when { font-size: 12.5px; color: #98a1ab; white-space: nowrap; }

  .person.past { color: #aab2bb; }
  .person.past .when { color: #c3c9d0; }

  .person.current {
    background: #e7f2e5;
    color: #203020;
    font-weight: 750;
    position: sticky;
    top: 0;
    z-index: 2;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }

  .person.current .when { color: #4c6b4a; }

  .person.current::after {
    content: "NEXT";
    font-size: 10px;
    letter-spacing: 1px;
    padding: 4px 7px;
    border-radius: 6px;
    background: #72a66f;
    color: white;
    align-self: center;
  }

  .status {
    margin-bottom: 18px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13.5px;
    display: none;
  }
  .status.show { display: block; }
  .status.warn { background: #fff6e0; border: 1px solid #f2dfae; color: #7a5a12; }
  .status.err  { background: #fdecec; border: 1px solid #f2c4c4; color: #8a2b2b; }

  footer { text-align: center; color: #8a929b; font-size: 12px; margin-top: 18px; }
  footer a { color: #8a929b; }

  .skeleton { color: #b8c0c8; }

  @media (max-width: 700px) {
    .next, .schedule { grid-template-columns: 1fr; }
    .list { max-height: 260px; }
  }
</style>
</head>

<body>
<div class="page">
  <header>
    <h1>MI Lab Presentation Schedule</h1>
    <div class="subtitle">Research Presentation · General Presentation</div>
  </header>

  <div class="status" id="status"></div>

  <section class="next">
    <div class="card next-card">
      <div class="label">Next Research Presentation</div>
      <div class="name skeleton" id="nextRP">Loading…</div>
      <div class="duration" id="rpMeta">30 minutes</div>
    </div>

    <div class="card next-card">
      <div class="label">Next General Presentation</div>
      <div class="name skeleton" id="nextGP">Loading…</div>
      <div class="duration" id="gpMeta">15 minutes</div>
    </div>
  </section>

  <section class="schedule">
    <div class="column">
      <div class="column-header">Research Presentation</div>
      <div class="list" id="rpList"></div>
    </div>

    <div class="column">
      <div class="column-header">General Presentation</div>
      <div class="list" id="gpList"></div>
    </div>
  </section>

  <footer id="footer">Fetching the latest schedule…</footer>
</div>

<script>
/* ============================================================
   CONFIG — the only part you need to edit.
   ============================================================

   1. Open the Google Sheet. Its URL looks like:
        https://docs.google.com/spreadsheets/d/1AbC...XyZ/edit#gid=0
      Paste the long id between /d/ and /edit into SHEET_ID below.

   2. Share > General access > "Anyone with the link" > Viewer.
      (Viewer is enough. The page only reads.)

   3. SHEET_NAME must exactly match the tab name.

   You can also override the sheet at runtime without editing this
   file, by opening the page as:
      page.html?id=<SHEET_ID>&sheet=<TAB_NAME>
============================================================ */

const CONFIG = {
  SHEET_ID:   "1Ggq7IK7lP6_0BKzJapYUmvrR99oWeqyBGNm1U9N60Pk",
  SHEET_NAME: "New Schedule",
  RP_MINUTES: "30 minutes",
  GP_MINUTES: "30 minutes",
  DAY_FIRST:  true   // dates in the sheet read as DD-MM-YY (31-08-26 = 31 Aug 2026)
};

/* Fallback used only if the sheet cannot be reached (offline, link
   revoked, etc). Snapshot of the spreadsheet as supplied. */
const FALLBACK = {
  rp: [
    ["can't load data","dd-mm-yy"]
  ],
  gp: [
    ["can't load data","dd-mm-yy"]
  ]
};

/* ---------- helpers ---------- */

const params  = new URLSearchParams(location.search);
const sheetId = params.get("id")    || CONFIG.SHEET_ID;
const tabName = params.get("sheet") || CONFIG.SHEET_NAME;

const $ = id => document.getElementById(id);

function setStatus(msg, kind) {
  const el = $("status");
  if (!msg) { el.className = "status"; return; }
  el.textContent = msg;
  el.className = "status show " + (kind || "warn");
}

/* Split one CSV line, honouring quoted fields. */
function splitCSVLine(line) {
  const out = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

function parseCSV(text) {
  // Join lines that were split inside a quoted field.
  const raw = text.replace(/\r\n/g, "\n").split("\n");
  const rows = [];
  let buf = "";
  for (const line of raw) {
    buf = buf ? buf + "\n" + line : line;
    const quotes = (buf.match(/"/g) || []).length;
    if (quotes % 2 === 0) { rows.push(splitCSVLine(buf)); buf = ""; }
  }
  if (buf) rows.push(splitCSVLine(buf));
  return rows;
}

const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

/* Tolerant date parser. Returns a Date at local midnight, or null. */
function parseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  if (!s) return null;

  // ISO first: 2026-09-07 (optionally with a time part)
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);

  // 7 Sep 2026 / Sep 7, 2026
  m = s.match(/^(\d{1,2})[ \-]([A-Za-z]{3,})[ \-](\d{2,4})/);
  if (m && MONTHS[m[2].slice(0,3).toLowerCase()] !== undefined)
    return new Date(fullYear(+m[3]), MONTHS[m[2].slice(0,3).toLowerCase()], +m[1]);
  m = s.match(/^([A-Za-z]{3,})[ \-](\d{1,2}),?[ \-](\d{2,4})/);
  if (m && MONTHS[m[1].slice(0,3).toLowerCase()] !== undefined)
    return new Date(fullYear(+m[3]), MONTHS[m[1].slice(0,3).toLowerCase()], +m[2]);

  // Numeric: 31-08-26, 31/08/2026, 8/31/2026
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    let a = +m[1], b = +m[2], y = fullYear(+m[3]);
    let day, mon;
    if (a > 12)      { day = a; mon = b; }   // unambiguous
    else if (b > 12) { day = b; mon = a; }
    else             { day = CONFIG.DAY_FIRST ? a : b;
                       mon = CONFIG.DAY_FIRST ? b : a; }
    return new Date(y, mon - 1, day);
  }
  const d = new Date(s);
  return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function fullYear(y) { return y < 100 ? 2000 + y : y; }

function fmtDate(d) {
  return d ? d.toLocaleDateString(undefined,
    { weekday: "short", day: "numeric", month: "short", year: "numeric" }) : "";
}

function todayMidnight() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

/* ---------- fetching ---------- */

/* gviz is the endpoint that reliably sends CORS headers for a
   link-shared sheet. The /export endpoint is kept as a backup. */
function endpoints(id, tab) {
  const bust = "&_=" + Date.now();
  const base = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(id);
  return [
    base + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(tab) + bust,
    base + "/export?format=csv&sheet=" + encodeURIComponent(tab) + bust
  ];
}

async function fetchSheet(id, tab) {
  let lastErr;
  for (const url of endpoints(id, tab)) {
    try {
      const res = await fetch(url, { cache: "no-store", redirect: "follow" });
      if (!res.ok) { lastErr = new Error("HTTP " + res.status); continue; }
      const text = await res.text();
      if (/^\s*</.test(text)) { lastErr = new Error("Got a login page, not CSV"); continue; }
      return text;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("Could not reach the sheet");
}

/* ---------- shaping the rows ---------- */

/* Find the header row and the columns we care about, so inserting or
   moving a column in the sheet does not break the page. */
function locateColumns(rows) {
  for (let r = 0; r < Math.min(rows.length, 12); r++) {
    const cells = rows[r].map(c => c.toLowerCase());
    const rp = cells.findIndex(c => c.includes("research"));
    const gp = cells.findIndex(c => c.includes("general"));
    if (rp === -1 || gp === -1) continue;
    let dt = cells.findIndex(c => c.includes("date"));
    if (dt === -1) dt = null;
    return { headerRow: r, rp, gp, dt };
  }
  return null;
}

/* Ignore rows that are legend text or the "30 min / 15 min" footer. */
function isNoise(name) {
  const n = name.toLowerCase();
  return !name
      || /^\d+\s*min/.test(n)
      || n.includes("color indicat")
      || n.includes("colour indicat");
}

function buildSeries(rows, col, dateCol, startRow) {
  const out = [];
  for (let r = startRow; r < rows.length; r++) {
    const name = (rows[r][col] || "").trim();
    if (isNoise(name)) continue;
    const dateStr = dateCol == null ? "" : (rows[r][dateCol] || "").trim();
    out.push({ name, date: parseDate(dateStr), raw: dateStr });
  }
  return out;
}

/* The next presenter is the first entry dated today or later.
   With no usable dates, fall back to the first row. */
function nextIndex(series) {
  const today = todayMidnight();
  const i = series.findIndex(e => e.date && e.date >= today);
  if (i !== -1) return i;
  return series.some(e => e.date) ? -1 : 0;   // -1 = cycle finished
}

/* ---------- rendering ---------- */

function render(listId, nameId, metaId, series, minutes) {
  const el = $(listId);
  el.innerHTML = "";
  const idx = nextIndex(series);

  series.forEach((entry, i) => {
    const row = document.createElement("div");
    row.className = "person"
      + (i === idx ? " current" : "")
      + (idx !== -1 && i < idx ? " past" : "");

    const who = document.createElement("span");
    who.className = "who";
    who.textContent = entry.name;
    row.appendChild(who);

    if (entry.date || entry.raw) {
      const when = document.createElement("span");
      when.className = "when";
      when.textContent = entry.date ? fmtDate(entry.date) : entry.raw;
      row.appendChild(when);
    }
    el.appendChild(row);
  });

  const nameEl = $(nameId);
  nameEl.classList.remove("skeleton");
  if (idx === -1) {
    nameEl.textContent = "Cycle complete";
    $(metaId).textContent = "No upcoming slot in the sheet";
  } else {
    const e = series[idx];
    nameEl.textContent = e.name;
    $(metaId).textContent = minutes + (e.date ? " · " + fmtDate(e.date) : "");
  }

  const cur = el.querySelector(".current");
  if (cur) requestAnimationFrame(() => {
    el.scrollTop = Math.max(0, cur.offsetTop - el.clientHeight / 2 + cur.offsetHeight / 2);
  });
}

function paint(rp, gp, note) {
  render("rpList", "nextRP", "rpMeta", rp, CONFIG.RP_MINUTES);
  render("gpList", "nextGP", "gpMeta", gp, CONFIG.GP_MINUTES);
  $("footer").textContent = note;
}

function useFallback(reason) {
  setStatus(reason + " Showing the last saved copy of the schedule, which may be out of date.", "err");
  const wrap = a => a.map(([name, raw]) => ({ name, date: parseDate(raw), raw }));
  paint(wrap(FALLBACK.rp), wrap(FALLBACK.gp), "Offline copy · not live");
}

/* ---------- go ---------- */

(async function init() {
  if (!sheetId || sheetId === "PASTE_YOUR_SHEET_ID_HERE") {
    useFallback("No Google Sheet ID has been set in this page yet.");
    return;
  }

  try {
    const csv  = await fetchSheet(sheetId, tabName);
    const rows = parseCSV(csv).filter(r => r.some(c => c !== ""));
    const cols = locateColumns(rows);
    if (!cols) throw new Error('No "Research"/"General" header row found in tab "' + tabName + '"');

    const rp = buildSeries(rows, cols.rp, cols.dt, cols.headerRow + 1);
    const gp = buildSeries(rows, cols.gp, cols.dt, cols.headerRow + 1);
    if (!rp.length && !gp.length) throw new Error("The sheet has no presenter rows");

    setStatus(null);
    paint(rp, gp, "Live from Google Sheets · loaded " +
      new Date().toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) +
      " · refresh the page to pull the latest");
  } catch (err) {
    useFallback("Could not load the sheet (" + err.message + ").");
  }
})();
</script>
</body>
</html>
